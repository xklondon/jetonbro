name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jetonbro
          POSTGRES_PASSWORD: jetonbro
          POSTGRES_DB: jetonbro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetonbro -d jetonbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jetonbro:jetonbro@localhost:5432/jetonbro
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-123456
      AUTH_URL: http://127.0.0.1:3000
      EMAIL_FROM: JetonBro <noreply@localhost>
      ALLOW_DEV_MAILBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run guardrails
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
