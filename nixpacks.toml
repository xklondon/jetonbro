# Install root deps, then Vite-build web/dist before any copy/start step.
# Not an npm workspace — one package.json at the repo root.
# Nixpacks defaults to Node 18; jsdom's deps need >=20.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_CACHE = "/tmp/.npm-cache"

[phases.setup]
nixPkgs = ["...", "nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
