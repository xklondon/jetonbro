<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Classic rebuild contact sheets</title>
    <style>
      body { margin: 24px; background: #071714; color: #f4ead5; font-family: Inter, system-ui, sans-serif; }
      h1, h2 { font-weight: 600; }
      section { margin: 0 0 32px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; max-width: 1100px; }
      figure { margin: 0; }
      img { width: 100%; height: auto; background: #03241c; border: 1px solid rgba(223, 189, 105, 0.28); }
      figcaption { margin-top: 8px; font-size: 12px; opacity: 0.78; }
    </style>
  </head>
  <body>
    <h1>Classic rebuild contact sheets</h1>
    <p>Left: approved board. Right: captured 390×844 reconstruction. This page does not grade MATCH.</p>

    <section>
      <h2>Home</h2>
      <div class="pair">
        <figure>
          <img src="../../design/reference/classic/approved/table-owner-setup.png" alt="Approved owner/setup board" />
          <figcaption>Approved owner/setup board</figcaption>
        </figure>
        <figure>
          <img src="./01-home-four-tables-390x844.png" alt="Home with four saved tables" />
          <figcaption>01 Home · four saved tables</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Create Table</h2>
      <div class="pair">
        <figure>
          <img src="../../design/reference/classic/approved/table-owner-setup.png" alt="Approved setup board" />
          <figcaption>Approved setup board</figcaption>
        </figure>
        <figure>
          <img src="./04-create-table-collapsed-390x844.png" alt="Create Table collapsed" />
          <figcaption>04 Create Table collapsed</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Dealer and Player live states</h2>
      <div class="pair">
        <figure>
          <img src="../../design/reference/classic/approved/blackjack-dealer-owner-phases.png" alt="Approved Dealer phases" />
          <figcaption>Approved Dealer phases</figcaption>
        </figure>
        <figure>
          <img src="../blackjack-visual/02-owner-dealer-betting-390x844.png" alt="Dealer betting" />
          <figcaption>Dealer Betting 390×844</figcaption>
        </figure>
      </div>
      <div class="pair">
        <figure>
          <img src="../../design/reference/classic/approved/blackjack-player-phases.png" alt="Approved Player phases" />
          <figcaption>Approved Player phases</figcaption>
        </figure>
        <figure>
          <img src="../blackjack-visual/07-player-betting-placed-390x844.png" alt="Player betting placed" />
          <figcaption>Player Betting placed 390×844</figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
