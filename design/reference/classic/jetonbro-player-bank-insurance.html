<div id="jbc2" data-role="player" data-phase="bet">
<style>
#jbc2{--emerald:#063d31;--felt:#075744;--felt-hi:#0b7056;--night:#071714;--panel:#0a241e;--gold:#dfbd69;--ivory:#f4ead5;--red:#b8373f;--blue:#2466a8;--green:#19865c;--black:#22282c;color:#fff;font-family:Inter,system-ui,sans-serif;max-width:430px;margin:auto}#jbc2 *{box-sizing:border-box}
#jbc2 .preview-tabs,#jbc2 .state-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:9px}.preview-tabs button,.state-tabs button{border:1px solid color-mix(in srgb,var(--foreground) 24%,transparent);background:color-mix(in srgb,var(--background) 92%,transparent);color:var(--foreground);padding:8px 14px;border-radius:999px}.preview-tabs button.on,.state-tabs button.on{background:var(--foreground);color:var(--background)}.state-tabs{display:none}.state-tabs.show{display:flex}.state-tabs button{padding:7px 12px}
#jbc2 .phone{height:790px;border-radius:34px;overflow:hidden;background:radial-gradient(circle at 50% 34%,var(--felt-hi),var(--felt) 48%,var(--emerald));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;box-shadow:0 20px 55px rgba(0,0,0,.3);position:relative}
#jbc2 header{padding:17px 17px 7px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(3,25,20,.88),transparent)}#jbc2 .brand{font-family:Georgia,serif;color:var(--gold);letter-spacing:.16em}.head-button{border:0;background:transparent;color:#fff;padding:7px}
#jbc2 .phase-head{text-align:center;padding:3px 14px 9px}.phase-head strong{font-family:Georgia,serif;color:var(--ivory);font-size:20px;display:block}.phase-head span{font-size:12px;opacity:.72}.bank-phase-control{display:none;margin:0 13px 7px;text-align:center}.bank-phase-control .current{font-size:12px;color:rgba(244,234,213,.72);margin-bottom:6px}.bank-phase-control .current strong{color:var(--gold)}.bank-phase-control button{width:100%;border:0;border-radius:10px;background:var(--gold);color:#30250d;padding:10px;font-weight:500}
#jbc2 main{min-height:0;padding:5px 10px 10px;display:flex;align-items:center}.player-boxes{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player-boxes.three{grid-template-columns:repeat(3,minmax(0,1fr))}.box{height:260px;border:1.5px solid rgba(223,189,105,.72);border-radius:44% 44% 18px 18px/22% 22% 18px 18px;background:rgba(2,23,18,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;padding:5px}.box.selected{background:rgba(223,189,105,.1);box-shadow:0 0 0 2px var(--gold),inset 0 0 25px rgba(223,189,105,.07)}.box-name{position:absolute;top:14px;color:var(--gold);font-size:11px;letter-spacing:.08em}.amount-label{font-size:11px;opacity:.65}.amount{font:31px Georgia,serif;color:var(--ivory)}.hint{font-size:11px;color:var(--ivory);opacity:.62;margin-top:8px}.chip-pile{height:58px;display:flex;align-items:flex-end;justify-content:center}.chip{width:44px;height:44px;border-radius:50%;border:3px dashed rgba(255,255,255,.72);box-shadow:inset 0 0 0 3px rgba(0,0,0,.24),0 5px 8px rgba(0,0,0,.3);display:grid;place-items:center;font-size:12px;font-weight:500;margin-left:-10px}.chip:first-child{margin-left:0}.c5{background:var(--red)}.c10{background:var(--blue)}.c25{background:var(--green)}.c50{background:var(--gold);color:#342706}
#jbc2 .dealer-grid{display:none;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-self:stretch;overflow:auto;align-content:center}.dealer-grid .box{height:175px;border-radius:30px 30px 14px 14px}.dealer-grid .amount{font-size:24px}.dealer-grid .chip-pile{height:46px}.dealer-grid .chip{width:38px;height:38px}.outcome{display:none;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}.outcome button{border:0;border-radius:7px;padding:7px 1px;font-size:11px}.won{background:var(--gold);color:#30250d}.push{background:var(--ivory);color:#21302b}.lost{background:var(--red);color:#fff}.result{font-size:11px;color:var(--ivory);margin-top:7px}
#jbc2 .dock{background:linear-gradient(180deg,rgba(7,23,20,.96),var(--night));border-top:1px solid rgba(223,189,105,.4);box-shadow:0 -12px 30px rgba(0,0,0,.3);padding:11px 13px 15px}.dock-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:9px}.dock-top small{display:block;color:rgba(244,234,213,.65)}.dock-top strong{font:24px Georgia,serif;color:var(--ivory)}.jetons{display:flex;justify-content:space-between}.jetons button{border:0;background:transparent;padding:1px}.jetons .chip{width:47px;height:47px;margin:0;border-width:4px}.exact{display:flex;gap:8px;margin-top:8px}.exact input{min-width:0;flex:1;border:1px solid rgba(223,189,105,.28);background:#10241f;color:var(--ivory);border-radius:10px;padding:10px;font-size:16px}.gold-button{border:0;border-radius:10px;background:var(--gold);color:#30250d;padding:10px 14px;font-weight:500}.play-controls{display:none;grid-template-columns:repeat(3,1fr);gap:7px}.play-controls button{border:1px solid rgba(223,189,105,.32);background:#10241f;color:var(--ivory);border-radius:10px;padding:12px 4px}.play-controls button.primary{background:var(--gold);color:#30250d}.payout-wait{display:none;text-align:center;color:var(--ivory);padding:7px}
#jbc2 .dealer-dock{display:none}.dealer-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:9px}.dealer-stats small{display:block;color:rgba(244,234,213,.58)}.dealer-stats strong{font:20px Georgia,serif;color:var(--ivory)}.dealer-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dealer-tools button{border:1px solid rgba(223,189,105,.28);background:#10241f;color:var(--ivory);border-radius:10px;padding:9px 4px}.insurance-pot{display:none;background:rgba(17,67,94,.78);border:1px solid rgba(115,190,231,.48);border-radius:12px;padding:9px;color:#d8f1ff;margin-bottom:8px}.pot-head{display:flex;justify-content:space-between;font-size:12px}.pot-head strong{font:20px Georgia,serif}.insurance-settle{display:none;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.insurance-settle button{border:0;border-radius:8px;padding:7px}.insurance-win{background:#82c5e8;color:#082534}.insurance-lose{background:#173c50;color:#d8f1ff}
#jbc2[data-phase="play"] .exact,#jbc2[data-phase="payout"] .exact{display:none}#jbc2[data-phase="play"] .play-controls{display:grid}#jbc2[data-phase="payout"] .payout-wait{display:block}
#jbc2[data-role="dealer"] .player-boxes,#jbc2[data-role="dealer"] .player-dock{display:none}#jbc2[data-role="dealer"] .dealer-grid{display:grid}#jbc2[data-role="dealer"] .dealer-dock{display:block}#jbc2[data-role="dealer"] .bank-phase-control{display:block}#jbc2[data-role="dealer"][data-phase="payout"] .outcome{display:grid}#jbc2[data-role="dealer"][data-phase="play"] .insurance-pot,#jbc2[data-role="dealer"][data-phase="payout"] .insurance-pot{display:block}#jbc2[data-role="dealer"][data-phase="payout"] .insurance-settle{display:grid}
#jbc2 .sheet{display:none;position:absolute;inset:0;background:rgba(0,0,0,.57);z-index:5;align-items:flex-end}.sheet.open{display:flex}.sheet-panel{width:100%;background:var(--panel);border-top:1px solid rgba(223,189,105,.4);padding:18px 16px 22px}.sheet-panel h3{margin:0 0 12px;font:20px Georgia,serif;color:var(--ivory)}.sheet-panel select,.sheet-panel input{width:100%;margin-bottom:9px;background:#102f27;color:var(--ivory);border:1px solid rgba(223,189,105,.28);border-radius:10px;padding:11px;font-size:16px}.sheet-actions{display:flex;gap:8px}.sheet-actions button{flex:1}
@media(max-width:360px){#jbc2 .phone{height:710px;border-radius:24px}#jbc2 .box{height:225px}.jetons .chip{width:42px;height:42px}.dealer-grid .box{height:155px}}
</style>
<div class="preview-tabs"><button class="on" data-role="player">Player</button><button data-role="dealer">Bank / Dealer</button></div>
<div class="state-tabs" id="bank-state-tabs" aria-label="Bank game state"><button data-state="bet" class="on">1 · Betting</button><button data-state="play">2 · Playing</button><button data-state="payout">3 · Payout</button></div>
<section class="phone">
 <header><button class="head-button" aria-label="Menu"><i data-lucide="menu" aria-hidden="true"></i></button><div class="brand">JETONBRO</div><span>♠ 12</span></header>
 <div class="phase-head"><strong id="c2-title">Place your bets</strong><span id="c2-copy">All your open boxes remain visible</span></div>
 <div class="bank-phase-control"><div class="current">CURRENT PHASE: <strong id="current-phase">BETTING</strong></div><button id="phase-next">Deal cards</button></div>
 <main>
  <div class="player-boxes" id="c2-player-boxes">
   <button class="box selected" data-own-box="1"><span class="box-name">YOUR BOX 1</span><span class="amount-label">BET</span><span class="amount">25</span><span class="chip-pile"><span class="chip c10">10</span><span class="chip c10">10</span><span class="chip c5">5</span></span><span class="hint">Selected</span></button>
   <button class="box" data-own-box="2"><span class="box-name">YOUR BOX 2</span><span class="amount-label">BET</span><span class="amount">10</span><span class="chip-pile"><span class="chip c10">10</span></span><span class="hint">Tap to select</span></button>
  </div>
  <div class="dealer-grid" id="c2-dealer-grid">
   <div class="box"><span class="box-name">ALEX · BOX 1</span><span class="amount">25</span><span class="chip-pile"><span class="chip c25">25</span></span><span class="outcome"><button class="won">Won</button><button class="push">Push</button><button class="lost">Lost</button></span></div>
   <div class="box"><span class="box-name">ALEX · BOX 2</span><span class="amount">10</span><span class="chip-pile"><span class="chip c10">10</span></span><span class="outcome"><button class="won">Won</button><button class="push">Push</button><button class="lost">Lost</button></span></div>
   <div class="box"><span class="box-name">JO · BOX 1</span><span class="amount">50</span><span class="chip-pile"><span class="chip c50">50</span></span><span class="outcome"><button class="won">Won</button><button class="push">Push</button><button class="lost">Lost</button></span></div>
   <div class="box"><span class="box-name">MIA · BOX 1</span><span class="amount">15</span><span class="chip-pile"><span class="chip c10">10</span><span class="chip c5">5</span></span><span class="outcome"><button class="won">Won</button><button class="push">Push</button><button class="lost">Lost</button></span></div>
  </div>
 </main>
 <footer class="dock player-dock">
  <div class="exact"><input type="number" inputmode="numeric" placeholder="Exact amount"><button class="gold-button">Bet</button></div>
  <div class="play-controls"><button>Insurance</button><button class="primary">Double</button><button id="c2-split">Split</button></div><div class="payout-wait">Your results appear inside each box</div>
  <div class="dock-top"><div><small>YOUR JETONS</small><strong>75</strong></div><div style="text-align:right"><small>AVAILABLE VALUE</small><strong id="selected-box">75</strong></div></div>
  <div class="jetons"><button><span class="chip c5">5</span></button><button><span class="chip c10">10</span></button><button><span class="chip c25">25</span></button><button><span class="chip c50">50</span></button></div>
 </footer>
 <footer class="dock dealer-dock">
  <div class="insurance-pot"><div class="pot-head"><span>INSURANCE SIDE POT · 2 bets</span><strong>20</strong></div><div class="insurance-settle"><button class="insurance-win">Dealer Blackjack</button><button class="insurance-lose">No Blackjack</button></div></div>
  <div class="dealer-stats"><div><small>PLAYERS</small><strong id="player-count">3</strong></div><div><small>BOXES</small><strong>4</strong></div><div><small>ON TABLE</small><strong>100</strong></div></div>
  <div class="dealer-tools"><button id="add-player">＋ Add player</button><button id="give-jetons">◎ Give jetons</button></div>
 </footer>
 <div class="sheet" id="c2-sheet"><div class="sheet-panel"><h3 id="sheet-title">Add player</h3><select id="sheet-player"><option>New player</option><option>Alex</option><option>Jo</option><option>Mia</option></select><input id="sheet-input" placeholder="Player name"><div class="sheet-actions"><button class="dealer-tools" id="cancel-sheet">Cancel</button><button class="gold-button" id="confirm-sheet">Confirm</button></div></div></div>
</section>
<script>
(()=>{const r=document.getElementById('jbc2'),title=r.querySelector('#c2-title'),copy=r.querySelector('#c2-copy'),next=r.querySelector('#phase-next'),sheet=r.querySelector('#c2-sheet');let role='player',phase='bet',settled=0;const phases=['bet','play','payout'];const words={player:{bet:['Place your bets','All your open boxes remain visible'],play:['Play your hands','Select a box, then choose an action'],payout:['Hand complete','Results appear separately for every box']},dealer:{bet:['Players are betting','Add players or distribute jetons while bets are open'],play:['Cards are in play','Every active box remains visible'],payout:['Settle every box','Tap Won, Push or Lost for each box']}};
function draw(){r.dataset.role=role;r.dataset.phase=phase;r.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===role));r.querySelector('#bank-state-tabs').classList.toggle('show',role==='dealer');r.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===phase));title.textContent=words[role][phase][0];copy.textContent=words[role][phase][1];r.querySelector('#current-phase').textContent=phase==='bet'?'BETTING':phase==='play'?'PLAYING':'PAYOUT';next.textContent=phase==='bet'?'Deal cards':phase==='play'?'Payout phase':settled===4?'Start next hand':'Settle all boxes';next.disabled=phase==='payout'&&settled<4;r.querySelector('.dealer-tools').style.visibility=phase==='bet'?'visible':'hidden'}
r.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;draw()});r.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{phase=b.dataset.state;draw()});r.querySelectorAll('[data-own-box]').forEach(b=>b.onclick=()=>{r.querySelectorAll('[data-own-box]').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.querySelector('.hint').textContent=on?'Selected':'Tap to select'})});
next.onclick=()=>{if(phase==='bet')phase='play';else if(phase==='play')phase='payout';else if(settled===4){phase='bet';settled=0;r.querySelectorAll('.result').forEach(x=>x.remove());r.querySelectorAll('.outcome').forEach(x=>x.style.display='')}draw()};
r.querySelectorAll('.outcome button').forEach(b=>b.onclick=()=>{const box=b.closest('.box'),out=box.querySelector('.outcome');if(box.querySelector('.result'))return;out.style.display='none';const result=document.createElement('span');result.className='result';const amount=+box.querySelector('.amount').textContent;result.textContent=b.textContent==='Won'?'Won · +'+amount*2:b.textContent==='Push'?'Push · '+amount+' back':'Lost · 0 back';box.appendChild(result);settled++;draw()});
function openSheet(type){sheet.classList.add('open');r.querySelector('#sheet-title').textContent=type==='player'?'Add player':'Give jetons';r.querySelector('#sheet-player').style.display=type==='player'?'none':'block';r.querySelector('#sheet-input').placeholder=type==='player'?'Player name':'Jeton amount'}r.querySelector('#add-player').onclick=()=>openSheet('player');r.querySelector('#give-jetons').onclick=()=>openSheet('jetons');r.querySelector('#cancel-sheet').onclick=()=>sheet.classList.remove('open');r.querySelector('#confirm-sheet').onclick=()=>sheet.classList.remove('open');r.querySelectorAll('.insurance-settle button').forEach(b=>b.onclick=()=>{r.querySelector('.insurance-pot').innerHTML='<div class="pot-head"><span>INSURANCE SETTLED · '+b.textContent+'</span><strong>✓</strong></div>'});r.querySelector('#c2-split').onclick=()=>{const grid=r.querySelector('#c2-player-boxes');if(grid.children.length===3)return;grid.classList.add('three');const b=document.createElement('button');b.className='box';b.innerHTML='<span class="box-name">SPLIT BOX 2A</span><span class="amount-label">BET</span><span class="amount">10</span><span class="chip-pile"><span class="chip c10">10</span></span><span class="hint">Tap to select</span>';grid.appendChild(b)};draw();
})();
</script>
</div>
